services:
  backend:
    image: ghcr.io/kaushikkj/ai-job-radar-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      SEED_DEMO_JOBS: "false"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/radar.db}
    ports:
      - "8000:8000"
    volumes:
      - radar_data:/app/data
      - ./companies.json:/app/seed-data/companies.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/kaushikkj/ai-job-radar-frontend:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  radar_data:
